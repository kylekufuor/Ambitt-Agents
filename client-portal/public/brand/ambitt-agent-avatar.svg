<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ambitt Agents">
  <!-- Email/avatar variant: the head is cropped tighter than the app icon so the
       visor still reads at 40-44px in an inbox. Antenna and arms are trimmed to
       the disc edge rather than shrunk, which keeps the eyes large. -->
  <circle cx="128" cy="128" r="128" fill="#00b3b3"/>
  <g transform="translate(29,34) scale(1.55)">
    <circle cx="64" cy="10" r="8" fill="#ffffff"/>
    <rect x="60" y="16" width="8" height="18" rx="4" fill="#ffffff"/>
    <rect x="6" y="58" width="13" height="30" rx="6.5" fill="#ffffff" opacity="0.75"/>
    <rect x="109" y="58" width="13" height="30" rx="6.5" fill="#ffffff" opacity="0.75"/>
    <rect x="16" y="32" width="96" height="74" rx="26" fill="#ffffff"/>
    <circle cx="46" cy="70" r="15" fill="#00b3b3"/>
    <circle cx="82" cy="70" r="15" fill="#00b3b3"/>
  </g>
</svg>
